<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>OFILAB - Gestión de Firmas</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f9;
    font-family: "Segoe UI", Arial, sans-serif;
}

.login-card {
    width: 390px;
    background: #ffffff;
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,.08);
}

.logo {
    width: 230px;
    max-width: 100%;
    display: block;
    margin: 0 auto 28px;
}

h1 {
    margin: 0;
    text-align: center;
    font-size: 24px;
}

.descripcion {
    margin: 8px 0 28px;
    text-align: center;
    color: #777;
    font-size: 14px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 16px 0 6px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d7d7d7;
    border-radius: 7px;
    font-size: 14px;
    outline: none;
}

input:focus {
    border-color: #64358c;
    box-shadow: 0 0 0 2px rgba(100,53,140,.10);
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: 0;
    border-radius: 7px;
    background: #64358c;
    color: #ffffff;
    font-weight: 700;
    cursor: pointer;
}

button:hover {
    background: #512a72;
}

#error {
    margin-top: 14px;
    color: #b3261e;
    text-align: center;
    font-size: 13px;
}

.footer {
    margin-top: 25px;
    text-align: center;
    color: #888;
    font-size: 12px;
}

</style>

</head>

<body>

<div class="login-card">

<img
src="/assets/ofilab-logo.png"
class="logo"
alt="OFILAB">

<h1>Gestión de Firmas</h1>

<div class="descripcion">
Panel de administración Ofimundo
</div>


<label>Usuario</label>

<input
id="usuario"
type="text"
value="admin"
autocomplete="username">


<label>Contraseña</label>

<input
id="password"
type="password"
autocomplete="current-password">


<button id="entrar">
Ingresar
</button>


<div id="error"></div>


<div class="footer">
Desarrollado por Cesar Caruz 😎
</div>

</div>


<script>

async function ingresar() {

    const usuario =
        document
        .getElementById("usuario")
        .value;

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("error");

    error.textContent = "";

    try {

        const r =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            usuario,
                            password
                        })
                }
            );


        const data =
            await r.json();


        if (!r.ok) {

            error.textContent =
                data.error ||
                "No se pudo iniciar sesión";

            return;
        }


        window.location =
            "/generador/";

    }

    catch(e) {

        error.textContent =
            "Error de conexión con el servidor";

    }

}


document
.getElementById("entrar")
.addEventListener(
    "click",
    ingresar
);


document
.getElementById("password")
.addEventListener(
    "keydown",
    e => {

        if (e.key === "Enter")
            ingresar();

    }
);

</script>

</body>

</html>
